<!DOCTYPE html>

<meta charset="UTF-8">

</head>
<body class="field-lines">

<div id="app"></div>

<script>
const HALF_SECONDS = 20 * 60;
const SUB_WINDOW = 5 * 60;

const DEFAULT_ROSTER = ['Annika','Beck','Benaiah','Caleb','Gemma','Iris','Jane','Jonah','Josiah','June','Malin','Nels','Onais','Roman'];

function freshPlayers(names, gkFlags){
  // Everyone starts on the bench - no algorithmic default lineup at all.
  // Coach assigns every position manually each game.
  return Array.from({length:14}, (_,i)=>({
    id:i, name: (names && names[i]) || DEFAULT_ROSTER[i] || '',
    pos: 'BENCH',
    present: true,
    gkWilling: gkFlags ? !!gkFlags[i] : false, // preserved on reset if provided, else coach checks manually
    seconds:0,
    posSeconds:{F:0,D:0,GK:0},
    consecutiveSeconds:0, // resets to 0 the instant they hit the bench
    halfSeconds:0, // resets at halftime - used to balance THIS half specifically
    halfPosSeconds:{F:0,D:0,GK:0},
  }));
}

let state = {
  screen: 'setup',
  players: freshPlayers(),
  running:false,
  elapsed:0,
  half:1,
  selected:null,
  intervalId:null,
  suggestions:[],
  lastSuggestedWindow:-1,
  rosterOpen:false,
  shortNote:'', // e.g. "Short 1 Defender" after an injury with no bench cover
  halftimeNotice:false,
  previewShown:false,
};

function fmt(s){
  s = Math.max(0, Math.round(s));
  const m = Math.floor(s/60);
  const sec = s%60;
  return m + ':' + String(sec).padStart(2,'0');
}

function render(){
  const app = document.getElementById('app');
  if(state.screen === 'setup'){
    app.innerHTML = renderSetup();
    bindSetupEvents();
  } else if(state.screen === 'stats'){
    app.innerHTML = renderStats();
    bindStatsEvents();
  } else {
    app.innerHTML = renderGame();
    bindGameEvents();
  }
}

function countsByPos(){
  const c = {F:0,D:0,GK:0,BENCH:0};
  state.players.forEach(p=>{ if(p.present) c[p.pos]++; });
  return c;
}

function presentCount(){
  return state.players.filter(p=>p.present).length;
}

// Target recalculates live off however many are present RIGHT NOW,
// so it shifts automatically if someone gets hurt, arrives late, or leaves.
function getTarget(){
  const n = Math.max(1, presentCount());
  return Math.round((HALF_SECONDS*2*7)/n);
}

// Half-scoped version of the same math, spanning ONE 20-minute half instead
// of the full 40-minute game. This is what the live suggestion algorithm
// uses so it balances minutes fresh within each half, instead of only
// converging toward a full-game total (which could let a kid get most of
// their minutes in one half and get shorted in the other).
function getHalfTarget(){
  const n = Math.max(1, presentCount());
  return Math.round((HALF_SECONDS*7)/n);
}

// How many field slots each line has. Goalie only has 1 slot vs 3 for
// forward/defender, so a fair GK target per kid is naturally much smaller
// than a fair forward or defender target - that's expected, not a bug.
const LINE_SLOTS = {F:3, D:3, GK:1};
function gkWillingCount(){
  return state.players.filter(p=>p.present && p.gkWilling).length;
}
function getGKTarget(){
  const n = Math.max(1, gkWillingCount());
  return Math.round((HALF_SECONDS*2*1)/n);
}
function getHalfGKTarget(){
  const n = Math.max(1, gkWillingCount());
  return Math.round((HALF_SECONDS*1)/n);
}
// Personalized: a goalie-willing kid's forward/defender target shrinks to
// make room for their goalie time, so their TOTAL still matches everyone
// else's total target. That's what guarantees goalie kids keep getting
// real forward and defender minutes instead of just parking in goal.
function getPosTarget(pos, player){
  if(pos === 'GK'){
    return (player && player.gkWilling) ? getGKTarget() : 0;
  }
  const willing = player ? player.gkWilling : false;
  const gkPortion = willing ? getGKTarget() : 0;
  const remaining = Math.max(0, getTarget() - gkPortion);
  return Math.round(remaining/2); // split evenly between forward and defender
}
function getHalfPosTarget(pos, player){
  if(pos === 'GK'){
    return (player && player.gkWilling) ? getHalfGKTarget() : 0;
  }
  const willing = player ? player.gkWilling : false;
  const gkPortion = willing ? getHalfGKTarget() : 0;
  const remaining = Math.max(0, getHalfTarget() - gkPortion);
  return Math.round(remaining/2);
}

function renderSetup(){
  const rows = state.players.map((p,i)=>`
    <div class="rowline ${p.present?'':'absent'}">
      <input type="checkbox" data-idx="${i}" data-role="present" ${p.present?'checked':''}>
      <input type="text" data-idx="${i}" placeholder="Player ${i+1} name" value="${p.name}">
      <select data-idx="${i}" data-role="pos" ${p.present?'':'disabled'}>
        <option value="F" ${p.pos==='F'?'selected':''}>Forward</option>
        <option value="D" ${p.pos==='D'?'selected':''}>Defender</option>
        <option value="GK" ${p.pos==='GK'?'selected':''}>Goalie</option>
        <option value="BENCH" ${p.pos==='BENCH'?'selected':''}>Bench</option>
      </select>
      <input type="checkbox" data-idx="${i}" data-role="gk" title="Willing to play goalie" ${p.gkWilling?'checked':''} ${p.present?'':'disabled'}>
    </div>
  `).join('');
  const gkWilling = state.players.filter(p=>p.present && p.gkWilling).length;
  const c = countsByPos();
  const present = presentCount();
  const bench = present - (c.F + c.D + c.GK);
  const ok = c.F===3 && c.D===3 && c.GK===1 && present>=7;
  const targetPreview = present>=1 ? getTarget() : 0;

  return `
    <div class="setup">
      <h1>Sub Tracker</h1>
      <p>7v7 &middot; 3 Fwd / 3 Def / 1 GK &middot; 45 min &middot; subs every 5 min</p>
      <p style="margin-top:4px;">Uncheck anyone who isn't at today's game. Check "GK" for kids willing to play goalie &mdash; that pool splits goalie minutes, so only willing kids rotate through net. You can add or remove players mid-game too, from the Roster button.</p>
      <div class="rowline" style="margin-bottom:2px;">
        <span></span><span></span><span></span><span class="gklabel">GK OK</span>
      </div>
      <div>${rows}</div>
      <div class="counts">
        <span>Present: <b>${present}</b></span>
        <span>Forwards: <b class="${c.F===3?'good':'bad'}">${c.F}/3</b></span>
        <span>Defenders: <b class="${c.D===3?'good':'bad'}">${c.D}/3</b></span>
        <span>Goalie: <b class="${c.GK===1?'good':'bad'}">${c.GK}/1</b></span>
        <span>Bench: <b>${bench>=0?bench:0}</b></span>
        <span>GK-willing: <b>${gkWilling}</b></span>
      </div>
      ${present>0 ? `<div class="target-preview">Today's target per present player: ${fmt(targetPreview)}${bench===0 && present===7 ? ' — full squad, no subs today' : ''}</div>` : ''}
      ${present>0 && present<7 ? `<div class="target-preview" style="color:#f2b5ae;">Need at least 7 present players for 7v7 &mdash; only ${present} checked in.</div>` : ''}
      <div class="plan">
        <strong>How it works:</strong> only checked-in players count toward today's lineup, bench, and target time. Every 5 minutes the app tells you exactly who to sub out and who to sub in &mdash; balancing each kid's minutes at that specific position, not just their overall total, so nobody gets parked at one spot all game. Goalie's per-kid target is naturally smaller than forward/defender since there's only 1 goalie slot on the field. If a kid gets hurt, shows up late, or has to leave early, use the Roster button during the game to add or remove them &mdash; every target adjusts automatically.
      </div>
      <button class="start-btn" id="startBtn" ${ok?'':'disabled'}>${ok? 'Start Game' : (present<7 ? 'Check in at least 7 players' : 'Assign exactly 3F / 3D / 1GK among present players')}</button>
    </div>
  `;
}

function bindSetupEvents(){
  document.querySelectorAll('.rowline input[type="text"]').forEach(inp=>{
    inp.addEventListener('input', e=>{
      state.players[+e.target.dataset.idx].name = e.target.value;
    });
  });
  document.querySelectorAll('.rowline select').forEach(sel=>{
    sel.addEventListener('change', e=>{
      const idx = +e.target.dataset.idx;
      state.players[idx].pos = e.target.value;
      if(e.target.value === 'GK') state.players[idx].gkWilling = true;
      render();
    });
  });
  document.querySelectorAll('.rowline input[data-role="gk"]').forEach(chk=>{
    chk.addEventListener('change', e=>{
      state.players[+e.target.dataset.idx].gkWilling = e.target.checked;
      render();
    });
  });
  document.querySelectorAll('.rowline input[data-role="present"]').forEach(chk=>{
    chk.addEventListener('change', e=>{
      const idx = +e.target.dataset.idx;
      state.players[idx].present = e.target.checked;
      render();
    });
  });
  const startBtn = document.getElementById('startBtn');
  if(startBtn){
    startBtn.addEventListener('click', ()=>{
      state.players.forEach((p,i)=>{ if(!p.name.trim()) p.name = 'Player ' + (i+1); });
      state.screen = 'game';
      render();
    });
  }
}

// Ranks every field player across ALL lines (F/D/GK) by how far over their
// own personalized target they are, so the biggest 3 offenders get swapped
// each window - not one-per-line, not the whole team. Anyone who's hit the
// hard stamina limit is swapped regardless of this cap (see below).
const MAX_SUGGESTIONS = 3; // realistic number of OPTIONAL rotation swaps per window
const MAX_CONSECUTIVE_SECONDS = 10 * 60; // hard stamina limit - no player stays on past this in one stretch
const FLOOR_SECONDS = SUB_WINDOW; // guaranteed minimum: at least one window's worth of time per half
const LAST_WINDOW_BOUNDARY = HALF_SECONDS - SUB_WINDOW; // the 15-minute mark - last chance to hit the floor before halftime/full-time

// projectSeconds: how many seconds from now until the actual swap happens
// (0 at the real window boundary, up to 30 during the early warning preview).
// On-field players accrue that much MORE time before the swap really occurs,
// so their stamina/overage numbers are projected forward to match reality
// at the moment it counts - otherwise a kid who's about to cross the 10:00
// limit, or about to become the most-overdue player, wouldn't get flagged
// until the preview already passed.
function computeSuggestions(projectSeconds, isLastWindowOfHalf){
  projectSeconds = projectSeconds || 0;
  const groups = ['F','D','GK'];
  const benchPool = state.players.filter(p=>p.present && p.pos==='BENCH').slice();
  if(benchPool.length === 0) return [];

  const used = new Set();
  const reservedOut = new Set(); // field players already slated to leave this round
  const out = [];

  function projectedConsecutive(p){ return p.consecutiveSeconds + projectSeconds; }
  function projectedHalfPos(p,g){ return p.halfPosSeconds[g] + projectSeconds; }

  function bestReplacement(g){
    let pool = benchPool.filter(b=>!used.has(b.id) && (g!=='GK' || b.gkWilling));
    if(pool.length === 0) return null;
    pool.sort((a,b)=>{
      // bench players aren't accruing position time while benched, so no projection here
      const dA = a.halfPosSeconds[g] - getHalfPosTarget(g,a);
      const dB = b.halfPosSeconds[g] - getHalfPosTarget(g,b);
      if(dA !== dB) return dA - dB;
      if(a.halfSeconds !== b.halfSeconds) return a.halfSeconds - b.halfSeconds;
      return Math.random() - 0.5;
    });
    return pool[0];
  }

  // HARD RULE, not a suggestion: anyone who WILL have hit the consecutive-
  // minutes stamina limit by the time the swap actually happens comes off,
  // even beyond the normal cap on how many swaps happen in one window.
  const mandatory = state.players
    .filter(p=>p.present && p.pos!=='BENCH' && projectedConsecutive(p) >= MAX_CONSECUTIVE_SECONDS)
    .sort((a,b)=> projectedConsecutive(b) - projectedConsecutive(a));
  mandatory.forEach(fieldP=>{
    const inP = bestReplacement(fieldP.pos);
    if(inP){
      out.push({outId: fieldP.id, inId: inP.id, pos: fieldP.pos, mandatory:true});
      used.add(inP.id);
      reservedOut.add(fieldP.id);
    }
  });

  // ANOTHER HARD RULE: this is the last sub window of the half - anyone
  // still sitting with less than one window's worth of time this half
  // (essentially hasn't played) is guaranteed on now, since there's no
  // opportunity left to fix it before the whistle. Bypasses the normal cap.
  if(isLastWindowOfHalf){
    const floorKids = benchPool
      .filter(p=>!used.has(p.id) && p.halfSeconds < FLOOR_SECONDS)
      .sort((a,b)=> a.halfSeconds - b.halfSeconds);
    floorKids.forEach(floorKid=>{
      const eligibleLines = groups.filter(g=> g!=='GK' || floorKid.gkWilling);
      // prefer whichever position they've played least, for variety
      eligibleLines.sort((a,b)=> floorKid.halfPosSeconds[a] - floorKid.halfPosSeconds[b]);
      for(const g of eligibleLines){
        const fieldGroup = state.players.filter(p=>p.present && p.pos===g && !reservedOut.has(p.id));
        if(fieldGroup.length === 0) continue;
        // bump whoever in that line has the most time this half
        let outgoing = fieldGroup[0];
        fieldGroup.forEach(p=>{ if(p.halfPosSeconds[g] > outgoing.halfPosSeconds[g]) outgoing = p; });
        out.push({outId: outgoing.id, inId: floorKid.id, pos: g, mandatory:true, floorGuarantee:true});
        used.add(floorKid.id);
        reservedOut.add(outgoing.id);
        break;
      }
    });
  }

  // Rank every remaining field player, across ALL lines, by how far over
  // their own personalized target THEY'LL BE FOR THIS HALF by the time the
  // swap happens - most overdue first, scoped to the current half so a kid
  // who played heavily in half 1 doesn't coast on that credit in half 2.
  // Capped so a normal window stays a handful of targeted swaps.
  let candidates = [];
  groups.forEach(g=>{
    state.players.filter(p=>p.present && p.pos===g && !reservedOut.has(p.id)).forEach(fieldP=>{
      candidates.push({fieldP, g, urgency: projectedHalfPos(fieldP,g) - getHalfPosTarget(g, fieldP)});
    });
  });
  candidates.sort((a,b)=> (b.urgency - a.urgency) || (Math.random() - 0.5));

  for(const c of candidates){
    if(out.length >= mandatory.length + MAX_SUGGESTIONS) break;
    const inP = bestReplacement(c.g);
    if(!inP) continue;
    out.push({outId: c.fieldP.id, inId: inP.id, pos: c.g, mandatory:false});
    used.add(inP.id);
  }
  return out;
}

function applySuggestion(sugg){
  const a = state.players.find(p=>p.id===sugg.outId);
  const b = state.players.find(p=>p.id===sugg.inId);
  if(!a || !b) return;
  const tmp = a.pos;
  a.pos = b.pos;
  b.pos = tmp;
}

// Called when the roster checkbox changes DURING a live game.
function togglePresentLive(idx){
  const p = state.players[idx];
  const turningOn = !p.present;
  p.present = turningOn;

  if(turningOn){
    // Late arrival: joins the bench, keeps whatever time they already have (usually 0).
    p.pos = 'BENCH';
    state.shortNote = '';
  } else {
    // Injured / leaving. If they were on the field, immediately backfill that slot
    // from the bench so the team isn't accidentally left short without you noticing.
    if(p.pos !== 'BENCH'){
      const vacated = p.pos;
      const benchPool = state.players.filter(pl=>pl.present && pl.pos==='BENCH' && (vacated!=='GK' || pl.gkWilling));
      if(benchPool.length > 0){
        let best = benchPool[0];
        benchPool.forEach(b=>{
          if(b.halfPosSeconds[vacated] < best.halfPosSeconds[vacated]) best = b;
          else if(b.halfPosSeconds[vacated] === best.halfPosSeconds[vacated] && b.halfSeconds < best.halfSeconds) best = b;
        });
        best.pos = vacated;
        state.shortNote = '';
      } else {
        state.shortNote = 'No ' + (vacated==='GK' ? 'goalie-willing ' : '') + 'bench players left \u2014 short 1 ' + POS_LABEL(vacated) + ' until someone is added back.';
      }
    }
  }
  state.suggestions = []; state.previewShown = false; // roster changed - force a fresh preview next warning
  render();
}

function renderGame(){
  const onField = state.players.filter(p=>p.present && p.pos!=='BENCH');
  const forwards = onField.filter(p=>p.pos==='F').sort((a,b)=>b.halfSeconds-a.halfSeconds);
  const defenders = onField.filter(p=>p.pos==='D').sort((a,b)=>b.halfSeconds-a.halfSeconds);
  const goalie = onField.filter(p=>p.pos==='GK');
  const bench = state.players.filter(p=>p.present && p.pos==='BENCH').sort((a,b)=>a.halfSeconds-b.halfSeconds);
  const lowestBenchSecs = bench.length? bench[0].halfSeconds : 0;
  const noSubsToday = bench.length === 0;
  const target = getTarget();

  const secsIntoHalf = state.elapsed - (state.half===1?0:HALF_SECONDS);
  const secsToNextSub = SUB_WINDOW - (((secsIntoHalf%SUB_WINDOW)+SUB_WINDOW)%SUB_WINDOW);
  const nearSub = secsToNextSub <= 30;
  const outIds = new Set(state.suggestions.map(s=>s.outId));
  const inIds = new Set(state.suggestions.map(s=>s.inId));

  function fieldCard(p){
    const pct = Math.min(100, (p.seconds/target)*100);
    const sel = state.selected === p.id;
    const gkClass = p.pos==='GK' ? 'gk' : '';
    const markClass = outIds.has(p.id) ? 'marked-out' : '';
    const atLimit = p.consecutiveSeconds >= MAX_CONSECUTIVE_SECONDS;
    const nearLimit = !atLimit && p.consecutiveSeconds >= MAX_CONSECUTIVE_SECONDS - 120;
    const stintClass = atLimit ? 'stint-max' : nearLimit ? 'stint-warn' : '';
    return `
      <div class="card ${gkClass} ${sel?'selected':''} ${markClass} ${stintClass}" data-id="${p.id}">
        ${atLimit?'<span class="flag" style="background:var(--danger);">Max stint</span>':''}
        <span class="name">${p.name}${(p.gkWilling && p.pos==='GK')?'<span class="gk-tag">GK</span>':''}</span>
        <span class="time">${fmt(p.seconds)} total</span>
        <span class="posbreak">On field: ${fmt(p.consecutiveSeconds)} / 10:00</span>
        <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
      </div>
    `;
  }

  function benchCard(p){
    const due = p.halfSeconds === lowestBenchSecs;
    const pct = Math.min(100, (p.seconds/target)*100);
    const sel = state.selected === p.id;
    const markClass = inIds.has(p.id) ? 'marked-in' : '';
    const fTgt = Math.round(getPosTarget('F',p)/60), dTgt = Math.round(getPosTarget('D',p)/60), gTgt = Math.round(getPosTarget('GK',p)/60);
    const posTag = `F ${Math.round(p.posSeconds.F/60)}/${fTgt}m &middot; D ${Math.round(p.posSeconds.D/60)}/${dTgt}m &middot; GK ${Math.round(p.posSeconds.GK/60)}/${gTgt}m`;
    return `
      <div class="card bench ${due?'due':''} ${sel?'selected':''} ${markClass}" data-id="${p.id}">
        ${due?'<span class="flag">Due</span>':''}
        <span class="name">${p.name}${p.gkWilling?'<span class="gk-tag">GK</span>':''}</span>
        <span class="time">${fmt(p.seconds)} total</span>
        <span class="posbreak">${posTag}</span>
        <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
      </div>
    `;
  }

  const suggPanel = state.suggestions.length ? `
    <div class="suggest-panel">
      <div class="stitle">Sub Assignments</div>
      ${state.suggestions.map(s=>{
        const outP = state.players.find(p=>p.id===s.outId);
        const inP = state.players.find(p=>p.id===s.inId);
        return `
          <div class="suggest-row">
            <div class="who">
              <span class="out">OUT ${outP.name} <span class="pos-tag">(${POS_LABEL(s.pos)}${s.floorGuarantee ? ', FLOOR MINUTES' : (s.mandatory ? ', STAMINA LIMIT' : '')}, ${fmt(outP.seconds)})</span></span>
              <span class="in">IN &nbsp;${inP.name} <span class="pos-tag">(${fmt(inP.seconds)})</span></span>
            </div>
          </div>
        `;
      }).join('')}
      <div class="suggest-actions">
        <button class="btn-apply" id="applyAllBtn">Apply All</button>
        <button class="btn-ghost" id="dismissBtn">Dismiss</button>
      </div>
    </div>
  ` : (noSubsToday ? `<div class="no-subs-msg">No one on the bench right now &mdash; no subs available.</div>` : '');

  const staminaBanner = (()=>{
    const overLimit = state.players.filter(p=>p.present && p.pos!=='BENCH' && p.consecutiveSeconds >= MAX_CONSECUTIVE_SECONDS);
    if(overLimit.length === 0) return '';
    return `<div class="warn-note" style="background:var(--danger); color:white; border-radius:8px; padding:6px 10px; margin-top:6px;">10:00 stamina limit hit: ${overLimit.map(p=>p.name).join(', ')} &mdash; sub now</div>`;
  })();

  const halftimeBanner = state.halftimeNotice ? `<div class="warn-note" style="background:var(--blue); color:white; border-radius:8px; padding:6px 10px; margin-top:6px;">Suggested 2nd half lineup is set below &mdash; adjust anyone by tapping bench then field, then hit Start.</div>` : '';

  const subWindowBanner = (nearSub && !noSubsToday && state.running) ? `<div class="warn-note" style="background:var(--amber); color:var(--ink); border-radius:8px; padding:6px 10px; margin-top:6px; font-weight:800; animation:pulse 1s infinite;">SUB WINDOW IN ${secsToNextSub}s &mdash; get ready</div>` : '';

  const rosterPanel = state.rosterOpen ? `
    <div class="roster-panel">
      <div class="stitle">Today's Roster</div>
      ${state.players.map((p,i)=>`
        <div class="roster-row">
          <input type="checkbox" data-idx="${i}" data-role="present" ${p.present?'checked':''}>
          <span class="rname">${p.name || ('Player '+(i+1))}</span>
          <span class="rpos">${p.present ? POS_LABEL(p.pos) : 'Not here'}</span>
          <label style="display:flex;align-items:center;gap:4px;font-size:0.65rem;color:#9fb8a6;">
            <input type="checkbox" data-idx="${i}" data-role="gkwilling" ${p.gkWilling?'checked':''}> GK
          </label>
        </div>
      `).join('')}
      <div class="roster-note">Uncheck a player who's hurt or leaving early &mdash; if they were on the field, the app immediately pulls the best-rested bench player into their spot. Check a late arrival back on and they join the bench. Uncheck GK for a kid who no longer wants to play goalie &mdash; if they're currently in net, they're pulled out right away and swapped for another willing player. Every target updates automatically.</div>
    </div>
  ` : '';

  return `
    <header>
      <h1>Sub Tracker</h1>
      <div class="half-label">Half ${state.half} of 2 &middot; ${presentCount()} present &middot; target ${fmt(target)}</div>
      <div class="clockrow">
        <div class="clock ${nearSub?'warn':''}">${fmt(secsIntoHalf)}</div>
      </div>
      <div class="target-note">${noSubsToday ? '' : (nearSub ? 'Sub window — see assignments below' : 'Next sub in ' + fmt(secsToNextSub))}</div>
      ${state.shortNote ? `<div class="warn-note">${state.shortNote}</div>` : ''}
      ${staminaBanner}
      ${subWindowBanner}
      ${halftimeBanner}
      <div class="btnrow">
        <button class="${state.running?'btn-pause':'btn-go'}" id="toggleBtn">${state.running? 'Pause':'Start'}</button>
        ${noSubsToday ? '' : `<button class="btn-suggest" id="suggestBtn">Suggest Subs</button>`}
        <button class="btn-roster" id="rosterBtn">${state.rosterOpen? 'Close Roster':'Roster'}</button>
        <button class="btn-ghost" id="statsBtn">Stats</button>
        <button class="btn-ghost" id="halftimeBtn" ${state.half===2?'disabled style="opacity:.3"':''}>End Half 1</button>
        <button class="btn-ghost" id="resetBtn">Reset</button>
      </div>
      ${rosterPanel}
      ${suggPanel}
    </header>
    <main>
      <div class="section-label"><span>On Field</span><span>tap to swap manually</span></div>
      <div class="poswrap">
        <div class="postitle"><span>Forwards</span>${forwards.length<3?`<span class="short">short ${3-forwards.length}</span>`:''}</div>
        <div class="grid">${forwards.map(fieldCard).join('')}</div>
      </div>
      <div class="poswrap">
        <div class="postitle"><span>Defenders</span>${defenders.length<3?`<span class="short">short ${3-defenders.length}</span>`:''}</div>
        <div class="grid">${defenders.map(fieldCard).join('')}</div>
      </div>
      <div class="poswrap">
        <div class="postitle"><span>Goalie</span>${goalie.length<1?`<span class="short">short 1</span>`:''}</div>
        <div class="grid" style="grid-template-columns:1fr;">${goalie.map(fieldCard).join('')}</div>
      </div>
      ${bench.length ? `
      <div class="section-label"><span>Bench (${bench.length})</span><span>lowest time = due</span></div>
      <div class="grid bench-grid">${bench.map(benchCard).join('')}</div>
      ` : ''}
      <div class="hint">${state.selected!==null ? 'Now tap the on-field player to swap with' : 'Target: ' + fmt(target) + ' total each by final whistle'}</div>
    </main>
    <footer class="legend">Tap "Suggest Subs" for assignments, "Roster" to add/remove a player mid-game</footer>
  `;
}

function POS_LABEL(pos){
  return pos==='F' ? 'Forward' : pos==='D' ? 'Defender' : pos==='GK' ? 'Goalie' : 'Bench';
}

function bindGameEvents(){
  document.getElementById('toggleBtn').addEventListener('click', toggleClock);
  const sb = document.getElementById('suggestBtn');
  if(sb) sb.addEventListener('click', ()=>{
    const secsIntoHalf = state.elapsed - (state.half===1?0:HALF_SECONDS);
    const inFinalSegment = secsIntoHalf >= LAST_WINDOW_BOUNDARY && secsIntoHalf < HALF_SECONDS;
    state.suggestions = computeSuggestions(0, inFinalSegment);
    render();
  });
  const ht = document.getElementById('halftimeBtn');
  if(ht) ht.addEventListener('click', endHalf);
  document.getElementById('resetBtn').addEventListener('click', resetGame);
  document.getElementById('rosterBtn').addEventListener('click', ()=>{
    state.rosterOpen = !state.rosterOpen;
    render();
  });
  document.getElementById('statsBtn').addEventListener('click', ()=>{
    state.screen = 'stats';
    render();
  });
  const applyAll = document.getElementById('applyAllBtn');
  if(applyAll) applyAll.addEventListener('click', ()=>{
    state.suggestions.forEach(applySuggestion);
    state.suggestions = [];
    render();
  });
  const dismiss = document.getElementById('dismissBtn');
  if(dismiss) dismiss.addEventListener('click', ()=>{
    state.suggestions = [];
    render();
  });
  document.querySelectorAll('.roster-row input[data-role="present"]').forEach(chk=>{
    chk.addEventListener('change', e=>{
      togglePresentLive(+e.target.dataset.idx);
    });
  });
  document.querySelectorAll('.roster-row input[data-role="gkwilling"]').forEach(chk=>{
    chk.addEventListener('change', e=>{
      const idx = +e.target.dataset.idx;
      const p = state.players[idx];
      p.gkWilling = e.target.checked;
      if(!p.gkWilling && p.pos === 'GK'){
        // they no longer want to play goalie and they're standing in net
        // right now - pull them out immediately, don't wait for the next
        // suggestion window.
        const benchPool = state.players.filter(b=>b.present && b.pos==='BENCH' && b.gkWilling);
        if(benchPool.length > 0){
          let best = benchPool[0];
          benchPool.forEach(b=>{
            if(b.halfPosSeconds.GK < best.halfPosSeconds.GK) best = b;
            else if(b.halfPosSeconds.GK === best.halfPosSeconds.GK && b.halfSeconds < best.halfSeconds) best = b;
          });
          best.pos = 'GK';
          p.pos = 'BENCH';
          state.shortNote = '';
        } else {
          state.shortNote = p.name + ' no longer wants to play goalie, but no other willing player is on the bench \u2014 move someone into net manually.';
        }
      }
      state.suggestions = []; state.previewShown = false; // roster changed - force a fresh preview next warning
      render();
    });
  });
  document.querySelectorAll('.card').forEach(c=>{
    c.addEventListener('click', ()=>onCardTap(+c.dataset.id));
  });
}

function onCardTap(id){
  if(state.selected === null){
    state.selected = id;
  } else if(state.selected === id){
    state.selected = null;
  } else {
    const a = state.players.find(p=>p.id===state.selected);
    const b = state.players.find(p=>p.id===id);
    if(a.pos !== b.pos && (a.pos==='BENCH' || b.pos==='BENCH')){
      const tmp = a.pos;
      a.pos = b.pos;
      b.pos = tmp;
    }
    state.selected = null;
  }
  render();
}

function toggleClock(){
  state.running = !state.running;
  if(state.running){
    state.lastTickTs = Date.now();
    state.fractionalAccum = 0;
    state.intervalId = setInterval(clockPump, 250);
    state.halftimeNotice = false;
  } else {
    clearInterval(state.intervalId);
  }
  render();
}

// Runs every 250ms but measures REAL elapsed time via Date.now(), not a
// naive "assume 1 second passed" counter. If the phone screen locks or
// Safari backgrounds the tab, timers get throttled or paused - when they
// resume, this catches up all the real seconds that actually passed
// instead of silently losing them (which was causing sub suggestions to
// fire late, after the real-world 5-minute mark had already passed).
function clockPump(){
  const now = Date.now();
  const deltaSec = (now - state.lastTickTs) / 1000;
  state.lastTickTs = now;
  state.fractionalAccum += deltaSec;
  let ticked = false;
  while(state.fractionalAccum >= 1 && state.running){
    state.fractionalAccum -= 1;
    tick();
    ticked = true;
  }
  if(ticked) render();
}

function tick(){
  state.elapsed += 1;
  state.players.forEach(p=>{
    if(p.present && p.pos !== 'BENCH'){
      p.seconds += 1;
      p.posSeconds[p.pos] += 1;
      p.consecutiveSeconds += 1;
      p.halfSeconds += 1;
      p.halfPosSeconds[p.pos] += 1;
    } else {
      p.consecutiveSeconds = 0; // resting resets their stint clock
    }
  });
  const secsIntoHalf = state.elapsed - (state.half===1?0:HALF_SECONDS);
  const windowIdx = Math.floor(secsIntoHalf / SUB_WINDOW) + (state.half===2 ? 100 : 0);
  const secInWindow = secsIntoHalf % SUB_WINDOW;
  const secsToNextSub = SUB_WINDOW - (((secsIntoHalf % SUB_WINDOW) + SUB_WINDOW) % SUB_WINDOW);
  const upcomingIsRealWindow = secsIntoHalf + secsToNextSub < HALF_SECONDS; // don't preview at halftime/full-time
  const upcomingBoundary = secsIntoHalf + secsToNextSub;

  // Show the suggestion panel as soon as the 30-second warning banner appears,
  // not just at the exact window boundary - so the coach has the assignments
  // ready to read during the pulsing "get ready" alert, not after it.
  if(secsToNextSub <= 30 && secsToNextSub > 0 && upcomingIsRealWindow && !state.previewShown){
    state.suggestions = computeSuggestions(secsToNextSub, upcomingBoundary === LAST_WINDOW_BOUNDARY);
    state.previewShown = true;
  }
  // Only the 5/10/15-minute marks are real sub windows. Exclude secsIntoHalf===0
  // (kickoff, nothing to sub yet) and secsIntoHalf===HALF_SECONDS (that's the
  // whistle for halftime/full-time, not a mid-half substitution).
  if(secInWindow === 0 && secsIntoHalf > 0 && secsIntoHalf < HALF_SECONDS && windowIdx !== state.lastSuggestedWindow){
    // If the 30-second preview already ran, trust it as final - don't
    // recompute and risk the list changing right as the coach reads it.
    // Only compute fresh here if somehow no preview happened (e.g. the
    // clock was paused during that window, or the app was just opened).
    if(!state.previewShown){
      state.suggestions = computeSuggestions(0, secsIntoHalf === LAST_WINDOW_BOUNDARY);
    }
    state.lastSuggestedWindow = windowIdx;
    state.previewShown = false; // reset so the NEXT window's early preview can fire
  }
  if(state.elapsed >= HALF_SECONDS*2){
    state.running = false;
    clearInterval(state.intervalId);
  }
}

function renderStats(){
  const rows = state.players.filter(p=>p.present).slice().sort((a,b)=>b.seconds-a.seconds).map(p=>{
    const fTgt = getPosTarget('F',p), dTgt = getPosTarget('D',p), gTgt = getPosTarget('GK',p);
    const totalTgt = getTarget();
    const diff = p.seconds - totalTgt;
    const diffStr = (diff>=0?'+':'') + Math.round(diff/60) + 'm';
    return `
      <tr>
        <td class="stats-name">${p.name}${p.gkWilling?'<span class="gk-tag">GK</span>':''}</td>
        <td class="num stats-total">${fmt(p.seconds)}</td>
        <td class="num" style="color:${Math.abs(diff)<60?'#7bd389':'#f2b5ae'};">${diffStr}</td>
        <td class="num">${fmt(p.posSeconds.F)}<br><span style="opacity:0.5;font-size:0.7em;">/ ${fmt(fTgt)}</span></td>
        <td class="num">${fmt(p.posSeconds.D)}<br><span style="opacity:0.5;font-size:0.7em;">/ ${fmt(dTgt)}</span></td>
        <td class="num">${fmt(p.posSeconds.GK)}<br><span style="opacity:0.5;font-size:0.7em;">/ ${fmt(gTgt)}</span></td>
      </tr>
    `;
  }).join('');

  const gameClockLabel = state.elapsed >= HALF_SECONDS*2 ? 'Full game (45:00)' : ('In progress \u2014 ' + fmt(state.elapsed) + ' elapsed');

  return `
    <div class="stats-wrap">
      <h1>Final Stats</h1>
      <p>${gameClockLabel} &middot; sorted by total minutes played</p>
      <table class="stats-table">
        <thead>
          <tr>
            <th>Player</th>
            <th>Total</th>
            <th>vs target</th>
            <th>Forward</th>
            <th>Defender</th>
            <th>Goalie</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="stats-note">"vs target" compares total minutes to today's equal-time target (${fmt(getTarget())}). Forward/Defender/Goalie columns show actual minutes over each player's own personalized target for that position \u2014 goalie-willing kids have smaller F/D targets since goalie time is carved out of the same total.</div>
      <button class="start-btn stats-back" id="backToGameBtn">Back to Game</button>
    </div>
  `;
}

function bindStatsEvents(){
  document.getElementById('backToGameBtn').addEventListener('click', ()=>{
    state.screen = 'game';
    render();
  });
}

// Builds a suggested 2nd-half lineup. Important distinction from a full
// re-draft: this starts from whoever was ALREADY on the field at the end of
// half 1 and only swaps someone in if their half-1 shortfall is genuinely
// large (>= 60s) - not just smaller than the next candidate's. A full
// ranking-based re-draft was tried first and made things worse: it always
// promotes whoever played least, which systematically gives them a bigger
// half 2 than half 1 (and the opposite for whoever played most) - the exact
// opposite of "equal time between halves." Preserving continuity and only
// correcting real outliers keeps each kid's two halves close to each other.
const HALFTIME_SWAP_THRESHOLD = 60;

function computeHalftimeLineup(){
  const groups = ['F','D','GK'];
  const present = state.players.filter(p=>p.present);
  const usedBench = new Set();

  groups.forEach(g=>{
    let onField = present.filter(p=>p.pos===g);
    // safety net: if a formerly-present GK is now absent, or the line is
    // short for any reason, treat as needing a fresh fill from bench
    let need = LINE_SLOTS[g] - onField.length;

    // Check each current starter in this line - swap out only if their half-1
    // time is a real outlier ABOVE target and a bench player is a real
    // outlier BELOW target for this same position.
    onField.slice().sort((a,b)=>{
      const overA = a.halfPosSeconds[g] - getHalfPosTarget(g,a);
      const overB = b.halfPosSeconds[g] - getHalfPosTarget(g,b);
      return overB - overA; // most over first
    }).forEach(starter=>{
      let benchPool = present.filter(p=>p.pos==='BENCH' && !usedBench.has(p.id) && (g!=='GK' || p.gkWilling));
      if(benchPool.length === 0) return;
      benchPool.sort((a,b)=>{
        const dA = a.halfPosSeconds[g] - getHalfPosTarget(g,a);
        const dB = b.halfPosSeconds[g] - getHalfPosTarget(g,b);
        if(dA !== dB) return dA - dB;
        return a.halfSeconds - b.halfSeconds;
      });
      const candidate = benchPool[0];
      const starterOverage = starter.halfPosSeconds[g] - getHalfPosTarget(g, starter);
      const candidateDeficit = getHalfPosTarget(g, candidate) - candidate.halfPosSeconds[g];
      if(starterOverage >= HALFTIME_SWAP_THRESHOLD && candidateDeficit >= HALFTIME_SWAP_THRESHOLD){
        starter.pos = 'BENCH';
        candidate.pos = g;
        usedBench.add(candidate.id);
      }
    });

    // fill any genuinely empty slots (shouldn't normally happen, but covers
    // absences/edge cases) with the least-played eligible bench player
    while(need > 0){
      let benchPool = present.filter(p=>p.pos==='BENCH' && !usedBench.has(p.id) && (g!=='GK' || p.gkWilling));
      if(g==='GK' && benchPool.length===0) benchPool = present.filter(p=>p.pos==='BENCH' && !usedBench.has(p.id));
      if(benchPool.length === 0) break;
      benchPool.sort((a,b)=> a.halfPosSeconds[g] - b.halfPosSeconds[g]);
      benchPool[0].pos = g;
      usedBench.add(benchPool[0].id);
      need--;
    }
  });
  present.forEach(p=>{
    p.consecutiveSeconds = 0; // everyone's rested after the water break
    p.halfSeconds = 0; // half 2 starts its own fresh balance, independent of half 1
    p.halfPosSeconds = {F:0,D:0,GK:0};
  });
}

function endHalf(){
  state.running = false;
  clearInterval(state.intervalId);
  state.half = 2;
  state.elapsed = HALF_SECONDS;
  state.suggestions = [];
  state.lastSuggestedWindow = -1;
  state.previewShown = false;
  computeHalftimeLineup();
  state.halftimeNotice = true; // shown until coach hits Start for 2nd half
  render();
}

function resetGame(){
  clearInterval(state.intervalId);
  // Names AND goalie-willingness carry over - positions and presence still
  // reset fresh each game since those genuinely change day to day.
  const keepNames = state.players.map(p=>p.name);
  const keepGk = state.players.map(p=>p.gkWilling);
  state = {
    screen: 'setup',
    players: freshPlayers(keepNames, keepGk),
    running:false, elapsed:0, half:1, selected:null, intervalId:null,
    suggestions:[], lastSuggestedWindow:-1, rosterOpen:false, shortNote:'', halftimeNotice:false, previewShown:false,
  };
  render();
}

render();
</script>
